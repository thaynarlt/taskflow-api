<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow - Gerenciamento de Tarefas</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <nav class="topbar">
      <a class="brand" href="#" aria-label="TaskFlow inicio">
        <span class="brand-mark">TF</span>
        <span>
          <strong>TaskFlow</strong>
          <small>Workspace</small>
        </span>
      </a>
      <span class="online-pill"><span></span> Projeto ativo</span>
    </nav>

    <div class="hero-content">
      <div>
        <p class="eyebrow">Organizacao da equipe</p>
        <h1>Transforme planos em <span>entregas.</span></h1>
        <p class="hero-description">Gerencie prioridades, responsaveis e prazos em um painel simples e objetivo.</p>
      </div>
      <div class="hero-card">
        <p>Fluxo de trabalho</p>
        <div class="workflow">
          <span>Pendente</span>
          <i></i>
          <span>Em andamento</span>
          <i></i>
          <span>Concluida</span>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="card">
      <h2 id="form-titulo">Nova tarefa</h2>
      <form id="task-form">
        <input type="hidden" id="task-id" />
        <label>
          Titulo
          <input type="text" id="titulo" required />
        </label>
        <label>
          Descricao
          <textarea id="descricao" rows="3"></textarea>
        </label>
        <label>
          Responsavel
          <input type="text" id="responsavel" />
        </label>
        <label>
          Prazo
          <input type="date" id="prazo" />
        </label>
        <label>
          Status
          <select id="status">
            <option value="pendente">Pendente</option>
            <option value="em andamento">Em andamento</option>
            <option value="concluida">Concluida</option>
          </select>
        </label>
        <div class="actions">
          <button type="submit" id="submit-btn">Salvar</button>
          <button type="button" id="cancel-btn" class="secondary" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Tarefas</h2>
        <select id="filter-status">
          <option value="">Todos os status</option>
          <option value="pendente">Pendente</option>
          <option value="em andamento">Em andamento</option>
          <option value="concluida">Concluida</option>
        </select>
      </div>
      <ul id="task-list"></ul>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
